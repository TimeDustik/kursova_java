spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///inventory_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672

jwt:
  # 64 bytes of 'A' chars Base64-encoded → valid HS512 secret
  secret: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQQ==
  access-token-ttl-seconds: 900
  refresh-token-ttl-seconds: 604800

crypto:
  # 32 bytes → valid AES-256 key (Base64)
  aes-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

rabbitmq:
  exchanges:
    inventory: inventory.exchange
  queues:
    notifications: inventory.notifications
    reports: inventory.reports
  routing-keys:
    notification: inventory.notification
    report: inventory.report

logging:
  level:
    root: WARN
    ua.edu.inventory: INFO
