<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head th:replace="~{fragments/layout :: head('Журнал аудиту')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid flex-grow-1">
  <div class="row h-100">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <h5 class="mb-3 text-secondary">Журнал аудиту</h5>
      <div th:replace="~{fragments/layout :: alerts}"></div>

      <!-- Filters -->
      <form method="get" class="row g-2 mb-3">
        <div class="col-sm-4">
          <select name="action" class="form-select form-select-sm">
            <option value="">— Дія —</option>
            <option th:each="a : ${actions}" th:value="${a}" th:text="${a}"></option>
          </select>
        </div>
        <div class="col-sm-4">
          <input type="text" name="entityType" class="form-control form-control-sm"
                 placeholder="Тип сутності (EQUIPMENT, USER...)"/>
        </div>
        <div class="col-sm-4">
          <button type="submit" class="btn btn-sm btn-outline-secondary w-100">
            <i class="bi bi-funnel"></i> Фільтр
          </button>
        </div>
      </form>

      <!-- Table -->
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Дата</th>
              <th>Актор (ID)</th>
              <th>Дія</th>
              <th>Тип сутності</th>
              <th>ID сутності</th>
              <th>IP</th>
              <th>Деталі</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${page.totalElements == 0}">
              <td colspan="7" class="text-center text-muted">Записів немає</td>
            </tr>
            <tr th:each="log : ${page.content}">
              <td class="text-nowrap small"
                  th:text="${#temporals.format(log.createdAt(), 'dd.MM.yyyy HH:mm:ss')}"></td>
              <td><code class="small" th:text="${log.actorUserId() ?: '—'}"></code></td>
              <td>
                <span class="badge"
                      th:classappend="${log.action().name() == 'DELETE'} ? 'text-bg-danger' :
                                      (${log.action().name() == 'CREATE'} ? 'text-bg-success' :
                                      (${log.action().name() == 'ASSIGN'} ? 'text-bg-primary' : 'text-bg-secondary'))"
                      th:text="${log.action()}"></span>
              </td>
              <td class="small" th:text="${log.entityType()}"></td>
              <td><code class="small" th:text="${log.entityId()}"></code></td>
              <td class="small" th:text="${log.ipAddress() ?: '—'}"></td>
              <td class="small text-truncate" style="max-width:200px"
                  th:text="${log.payload() != null ? log.payload().toString() : ''}"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <nav th:if="${page.totalPages > 1}">
        <ul class="pagination pagination-sm">
          <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/audit-log(page=${page.number - 1})}">«</a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
              th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{/admin/audit-log(page=${i})}" th:text="${i + 1}"></a>
          </li>
          <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/audit-log(page=${page.number + 1})}">»</a>
          </li>
        </ul>
      </nav>
    </main>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
