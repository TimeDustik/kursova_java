<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="uk">
<head th:replace="~{fragments/layout :: head('Дашборд')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid flex-grow-1">
  <div class="row h-100">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <h5 class="mb-4 text-secondary">Панель управління</h5>
      <div th:replace="~{fragments/layout :: alerts}"></div>

      <!-- WORKER view -->
      <div th:if="${role == 'WORKER'}">
        <div class="row g-3">
          <div class="col-sm-6 col-xl-4">
            <div class="card card-stat border-primary text-center p-3">
              <div class="fs-1 text-primary fw-bold" th:text="${myEquipment}">0</div>
              <div class="text-muted small">Моє обладнання</div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-4">
            <div class="card card-stat border-success text-center p-3">
              <div class="fs-1 text-success fw-bold" th:text="${myLicenses}">0</div>
              <div class="text-muted small">Мої ліцензії</div>
            </div>
          </div>
        </div>
        <div class="mt-4">
          <a href="/my-inventory" class="btn btn-outline-primary">
            <i class="bi bi-laptop me-1"></i> Переглянути мій інвентар
          </a>
        </div>
      </div>

      <!-- TEAM_LEAD view -->
      <div th:if="${role == 'TEAM_LEAD'}">
        <div class="row g-3">
          <div class="col-sm-6 col-xl-3">
            <div class="card card-stat border-primary text-center p-3">
              <div class="fs-1 text-primary fw-bold" th:text="${totalEquipment}">0</div>
              <div class="text-muted small">Всього обладнання</div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card card-stat border-success text-center p-3">
              <div class="fs-1 text-success fw-bold" th:text="${assignedEquipment}">0</div>
              <div class="text-muted small">Призначено</div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card card-stat border-info text-center p-3">
              <div class="fs-1 text-info fw-bold" th:text="${totalLicenses}">0</div>
              <div class="text-muted small">Ліцензії</div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card card-stat border-warning text-center p-3">
              <div class="fs-1 text-warning fw-bold" th:text="${exhaustedLicenses}">0</div>
              <div class="text-muted small">Вичерпані місця</div>
            </div>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <a href="/team" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-people me-1"></i> Команда (<span th:text="${teamSize}">0</span>)
          </a>
          <a href="/admin/equipment" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-hdd-stack me-1"></i> Обладнання
          </a>
        </div>
      </div>

      <!-- ADMIN / AUDITOR view -->
      <div th:if="${role == 'ADMIN' or role == 'AUDITOR'}">
        <div class="row g-3">
          <div class="col-sm-6 col-xl-3">
            <div class="card card-stat border-primary text-center p-3">
              <div class="fs-1 text-primary fw-bold" th:text="${totalEquipment}">0</div>
              <div class="text-muted small">Активне обладнання</div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card card-stat border-success text-center p-3">
              <div class="fs-1 text-success fw-bold" th:text="${assignedCount}">0</div>
              <div class="text-muted small">Призначено</div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card card-stat border-secondary text-center p-3">
              <div class="fs-1 text-secondary fw-bold" th:text="${inStockCount}">0</div>
              <div class="text-muted small">На складі</div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card card-stat border-info text-center p-3">
              <div class="fs-1 text-info fw-bold" th:text="${totalLicenses}">0</div>
              <div class="text-muted small">Ліцензії</div>
            </div>
          </div>
        </div>
        <div class="row g-3 mt-1">
          <div class="col-sm-6 col-xl-3">
            <div class="card card-stat border-dark text-center p-3">
              <div class="fs-1 text-dark fw-bold" th:text="${totalUsers}">0</div>
              <div class="text-muted small">Користувачів</div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="card card-stat border-warning text-center p-3">
              <div class="fs-1 text-warning fw-bold" th:text="${totalSites}">0</div>
              <div class="text-muted small">Об'єктів</div>
            </div>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2 flex-wrap">
          <a href="/admin/equipment" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-hdd-stack me-1"></i> Обладнання
          </a>
          <a href="/admin/licenses" class="btn btn-outline-info btn-sm">
            <i class="bi bi-key me-1"></i> Ліцензії
          </a>
          <a href="/admin/users" class="btn btn-outline-dark btn-sm">
            <i class="bi bi-person-lines-fill me-1"></i> Користувачі
          </a>
          <a href="/admin/sites" class="btn btn-outline-warning btn-sm">
            <i class="bi bi-building me-1"></i> Об'єкти
          </a>
          <a href="/admin/audit-log" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-journal-text me-1"></i> Журнал аудиту
          </a>
        </div>
      </div>
    </main>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
