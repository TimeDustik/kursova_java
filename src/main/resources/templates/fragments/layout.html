<!DOCTYPE html>
<!--
  Pattern: Composite / Template Method.
  Reason: спільні частини UI (navbar, sidebar, footer) виносяться у фрагменти
  і підключаються до будь-якої сторінки через th:replace,
  уникаючи дублювання коду. Зміна дизайну — в одному місці.
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ═══ HEAD ════════════════════════════════════════════════════════════════ -->
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title} + ' — IT Inventory'">IT Inventory</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body { background-color: #f8f9fa; }
    .sidebar { min-height: calc(100vh - 56px); background: #212529; }
    .sidebar .nav-link { color: #adb5bd; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #343a40; border-radius: .375rem; }
    .sidebar .nav-link i { width: 1.25rem; }
    .card-stat { border-left: 4px solid; }
    .badge-role-ADMIN      { background-color: #dc3545; }
    .badge-role-TEAM_LEAD  { background-color: #0d6efd; }
    .badge-role-WORKER     { background-color: #198754; }
    .badge-role-AUDITOR    { background-color: #6c757d; }
  </style>
</head>

<!-- ═══ NAVBAR ══════════════════════════════════════════════════════════════ -->
<nav th:fragment="navbar" class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="/dashboard">
    <i class="bi bi-pc-display-horizontal me-2"></i>IT Inventory
  </a>
  <div class="d-flex align-items-center gap-3">
    <span class="text-light small" sec:authentication="name">Гість</span>
    <span th:if="${#authentication != null and #authentication.principal.siteName != null}"
          class="text-light small opacity-75"
          th:text="${#authentication.principal.siteName}"></span>
    <span class="badge text-bg-secondary"
          sec:authentication="principal.role">—</span>
    <form th:action="@{/web/logout}" method="post" class="m-0">
      <button class="btn btn-outline-light btn-sm" type="submit">
        <i class="bi bi-box-arrow-right"></i> Вийти
      </button>
    </form>
  </div>
</nav>

<!-- ═══ SIDEBAR ══════════════════════════════════════════════════════════════ -->
<div th:fragment="sidebar" class="sidebar col-md-2 p-3">
  <ul class="nav flex-column gap-1">
    <li class="nav-item">
      <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" href="/dashboard">
        <i class="bi bi-speedometer2"></i> Дашборд
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${activePage == 'my-inventory'} ? 'active'" href="/my-inventory">
        <i class="bi bi-laptop"></i> Мій інвентар
      </a>
    </li>

    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','TEAM_LEAD')">
      <a class="nav-link" th:classappend="${activePage == 'team'} ? 'active'" href="/team">
        <i class="bi bi-people"></i> Команда
      </a>
    </li>

    <hr class="border-secondary my-2" sec:authorize="hasAnyRole('ADMIN','AUDITOR','TEAM_LEAD')"/>
    <li class="nav-item small text-secondary px-2 mb-1"
        sec:authorize="hasAnyRole('ADMIN','AUDITOR','TEAM_LEAD')">УПРАВЛІННЯ</li>
    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','AUDITOR','TEAM_LEAD')">
      <a class="nav-link" th:classappend="${activePage == 'equipment'} ? 'active'" href="/admin/equipment">
        <i class="bi bi-hdd-stack"></i> Обладнання
      </a>
    </li>
    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','AUDITOR','TEAM_LEAD')">
      <a class="nav-link" th:classappend="${activePage == 'licenses'} ? 'active'" href="/admin/licenses">
        <i class="bi bi-key"></i> Ліцензії
      </a>
    </li>
    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','AUDITOR')">
      <a class="nav-link" th:classappend="${activePage == 'users'} ? 'active'" href="/admin/users">
        <i class="bi bi-person-lines-fill"></i> Користувачі
      </a>
    </li>
    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','AUDITOR')">
      <a class="nav-link" th:classappend="${activePage == 'sites'} ? 'active'" href="/admin/sites">
        <i class="bi bi-building"></i> Об'єкти
      </a>
    </li>
    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','AUDITOR')">
      <a class="nav-link" th:classappend="${activePage == 'audit'} ? 'active'" href="/admin/audit-log">
        <i class="bi bi-journal-text"></i> Журнал аудиту
      </a>
    </li>
  </ul>
</div>

<!-- ═══ ALERTS ═══════════════════════════════════════════════════════════════ -->
<div th:fragment="alerts">
  <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

<!-- ═══ FOOTER ════════════════════════════════════════════════════════════════ -->
<footer th:fragment="footer" class="text-center text-muted small py-3 border-top mt-auto">
  IT Inventory System &copy; 2025 &mdash; Курсовий проект
</footer>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</html>
