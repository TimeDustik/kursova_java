<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head th:replace="~{fragments/layout :: head('Помилка')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-dark">

<div class="card shadow text-center" style="width:24rem;">
  <div class="card-body p-5">
    <div class="display-1 fw-bold text-danger mb-3" th:text="${status ?: '500'}">500</div>
    <h5 class="card-title" th:text="${error ?: 'Помилка сервера'}">Помилка сервера</h5>
    <p class="text-muted small" th:text="${message ?: 'Щось пішло не так. Спробуйте пізніше.'}"></p>
    <a href="/dashboard" class="btn btn-primary mt-3">
      <i class="bi bi-house me-1"></i> На головну
    </a>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
