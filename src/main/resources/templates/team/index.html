<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head th:replace="~{fragments/layout :: head('Команда')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid flex-grow-1">
  <div class="row h-100">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <h5 class="mb-4 text-secondary">Команда</h5>
      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div th:if="${#lists.isEmpty(members)}" class="alert alert-info">
        У вашому об'єкті ще немає активних користувачів.
      </div>

      <div th:unless="${#lists.isEmpty(members)}" class="row g-3">
        <div th:each="m : ${members}" class="col-md-6 col-xl-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body d-flex align-items-start gap-3">
              <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                   style="width:48px;height:48px;font-size:1.25rem;flex-shrink:0;">
                <i class="bi bi-person-fill"></i>
              </div>
              <div class="flex-grow-1">
                <div class="fw-semibold" th:text="${m.fullName ?: m.username}"></div>
                <div class="text-muted small" th:text="${'@' + m.username}"></div>
                <div class="mt-1">
                  <span class="badge"
                        th:classappend="${'badge-role-' + m.role.name()}"
                        th:text="${m.role}"></span>
                </div>
                <div class="text-muted small mt-1" th:text="${m.email}"></div>
              </div>
            </div>
            <div class="card-footer bg-transparent">
              <a th:href="@{/team/{id}(id=${m.id})}" class="btn btn-sm btn-outline-primary w-100">
                <i class="bi bi-eye me-1"></i> Деталі
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
