spring:
  application:
    name: inventory-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${SPRING_DATASOURCE_USERNAME:inventory}
    password: ${SPRING_DATASOURCE_PASSWORD:inventory}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# JWT configuration
jwt:
  secret: ${JWT_SECRET:VGhpcyBpcyBhIHN1cGVyIHNlY3JldCBrZXkgZm9yIGp3dCB0aGF0IGlzIGF0IGxlYXN0IDI1NiBiaXRzIGxvbmc=}
  access-token-ttl-seconds: ${JWT_ACCESS_TTL:900}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}

# AES key for license key encryption (must be 32 chars = 256-bit)
crypto:
  aes-key: ${AES_KEY:01234567890123456789012345678901}

# RabbitMQ queues
rabbitmq:
  queues:
    notification: inventory.notifications
    report: inventory.reports
  exchanges:
    inventory: inventory.exchange
  routing-keys:
    notification: notification.key
    report: report.key

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  show-actuator: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    ua.edu.inventory: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
